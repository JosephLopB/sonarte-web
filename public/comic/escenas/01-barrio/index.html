<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escena Nariño 1962 – SonArte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Lato',Calibri,sans-serif}
#stage{position:absolute;left:0;top:0;width:1990px;height:1080px;transform-origin:0 0;background:#000;overflow:hidden;user-select:none}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
/* burbuja de Joe (tapa la del video) */
#bub{position:absolute;inset:0;z-index:4;pointer-events:none}
.dot,#ell{position:absolute;background:#fff;border-radius:50%;opacity:0;transform:scale(.2);transition:opacity .15s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.dot.on,#ell.on{opacity:1;transform:scale(1)}
#ell{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 90px;font-weight:900;font-size:50px;line-height:1.25;color:#0a0a0a;transform-origin:10% 80%}
#ell.wig{animation:wig .5s ease}
@keyframes wig{0%,100%{transform:scale(1)}30%{transform:scale(1.04) rotate(-1deg)}60%{transform:scale(.98) rotate(.8deg)}}
#ell i{display:inline-block;width:3px;height:.9em;background:#0a0a0a;margin-left:3px;vertical-align:-4px;animation:b .7s steps(1) infinite}
/* sello del lugar */
#lugar{position:absolute;top:70px;left:0;right:0;text-align:center;z-index:3;font-weight:900;font-size:58px;letter-spacing:6px;color:#fbefc8;text-shadow:0 4px 18px #000,0 0 30px rgba(255,200,90,.5);opacity:0;transition:opacity 1.2s;pointer-events:none}
#lugar small{display:block;font-size:34px;letter-spacing:10px;margin-top:6px;color:#f0c46b}
#lugar.on{opacity:1}
/* cuadro de texto */
.box{position:absolute;left:0;right:0;bottom:0;height:300px;padding:40px 82px;background:rgb(143,143,130);opacity:0;transform:translateY(40px);transition:opacity .45s,transform .45s;z-index:8;pointer-events:none}
.box.show{opacity:1;transform:none}
.who{font-weight:900;font-size:50px;color:#6b2e14;margin-bottom:14px}
.txt{font-weight:900;font-size:41px;line-height:1.3;color:#0a0a0a;min-height:110px}
.txt i{display:inline-block;width:3px;height:.9em;background:#0a0a0a;margin-left:3px;vertical-align:-4px;animation:b .7s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.btn{font:900 26px Lato,sans-serif;border:3px solid #6b2e14;background:rgba(143,143,130,.95);color:#2a1006;padding:10px 22px;cursor:pointer;border-radius:4px}
.btn:hover,.btn:focus-visible{background:#f0e4c8;outline:none}
.bar{position:absolute;top:24px;right:30px;display:none;gap:12px;z-index:9}
#start{position:absolute;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center}
#stage.paused *{animation-play-state:paused!important}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline preload="auto"></video>
  <div id="lugar">BARRIO NARIÑO<small>CARTAGENA · 1962</small></div>
  <div id="bub">
    <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div id="ell"></div>
  </div>
  <canvas id="fx" width="1990" height="1080"></canvas>
  <div class="box" id="box"><div class="who" id="who"></div><div class="txt" id="txt"></div></div>
  <div class="bar" id="bar"><button class="btn" id="bPause">⏸ Pausa</button></div>
  <div id="start"><button class="btn" id="go" style="display:none;font-size:40px;padding:20px 60px">▶ Comenzar</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const stage=$('stage'),v=$('v'),box=$('box'),who=$('who'),txt=$('txt'),cv=$('fx'),gx=cv.getContext('2d'),bPause=$('bPause'),startEl=$('start'),goBtn=$('go'),ell=$('ell'),lugar=$('lugar');

/* ================= CONFIGURACIÓN ================= */
const CFG={
  video:'barrio.mp4',
  grillos:true            // grillos suaves de noche (false para quitarlos)
};
/* Diálogos: ini/fin = segundos DEL VIDEO en que se escribe cada frase */
const D=[
  {desde:0,   a:.2,  b:7.2,  quien:'El Centurión', texto:'Toda leyenda empieza en una calle cualquiera. Esta empieza en Cartagena, en el barrio Nariño, en 1962.'},
  {desde:9.3, a:9.4, b:12.6, quien:'Vecina 1',     texto:'¡Ahí va otra vez ese pelao\' cantando solo!'},
  {desde:13.1,a:13.3,b:18.2, quien:'Vecina 2',     texto:'Deja a Álvaro tranquilo, mija. Ese niño tiene la música metida por dentro.'}
];
const T_BOX_FIN=19.05;       // aquí el video quita su franja de texto; mi cuadro también
const JOE={texto:'No es que quiera cantar... es que se me sale.',a:19.9,b:23.2};

/* ================= ESCALA Y AVISOS ================= */
function fit(){const s=Math.min(innerWidth/1990,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1990*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
function warn(msg){
  let w=$('warn');
  if(!w){w=document.createElement('div');w.id='warn';w.style.cssText='position:absolute;left:30px;top:20px;z-index:50;background:#b11917;color:#fff;font:700 26px Lato,sans-serif;padding:12px 22px;border-radius:6px;max-width:1500px';stage.appendChild(w)}
  w.innerHTML+=msg+'<br>';clearTimeout(w._t);w._t=setTimeout(()=>w.remove(),14000);
}
v.src=encodeURI(CFG.video);v.load();v.addEventListener('ended',()=>document.documentElement.classList.add('escena-lista'));
v.addEventListener('error',()=>warn('No se pudo cargar "'+CFG.video+'". Revisa que esté en la misma carpeta que index.html.'));
v.addEventListener('loadeddata',()=>{try{if(v.currentTime<.05)v.currentTime=.05}catch(e){}});

/* ================= POSICIÓN DE LA BURBUJA (coordenadas del video 1920x1080 -> escenario) ================= */
const K=1990/1920,OY=(1080*K-1080)/2;
function place(el,cx,cy,rx,ry){el.style.left=(cx*K-rx*K)+'px';el.style.top=(cy*K-OY-ry*K)+'px';el.style.width=(2*rx*K)+'px';el.style.height=(2*ry*K)+'px'}
place($('d1'),974.5,419,19,19);place($('d2'),1033,395.5,31,32);place($('d3'),1096,377.5,38,38);place(ell,1460,287,382,294);
const bubC={x:1460*K,y:287*K-OY};

/* ================= SONIDOS ================= */
let ac=null,sg=null,noiseBuf=null,grilloT=0;
function audioInit(){
  if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();sg=ac.createGain();sg.gain.value=.8;sg.connect(ac.destination);
  const n=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,n,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
}
function partial(f,t,pk,dec,type,att){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+(att||.008));g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(g);g.connect(sg);o.start(t);o.stop(t+dec+.05)}
function bell(f,vol){if(!ac)return;const t=ac.currentTime;[[1,1],[2.01,.4],[3.02,.15]].forEach(([m,a])=>partial(f*m,t,(vol||.15)*a,2.2))}
function pop(vol){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(180,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(sg);o.start(t);o.stop(t+.2)}
function grillo(){if(!ac)return;const t=ac.currentTime;for(let i=0;i<4;i++)partial(4300,t+i*.07,.012,.05,'sine',.01)}
const PENT=[392,440,523.25,587.33,659.25,783.99,880];

/* ================= PARTÍCULAS ================= */
const P=[];
function ripple(x,y,col){P.push({k:'r',x,y,vx:0,vy:0,t:0,life:1.1,col})}
function mote(x,y,col,up,w){P.push({k:'m',x,y,vx:(Math.random()-.5)*24,vy:(up?-1:-.2)*(20+Math.random()*40),t:0,life:2.4+Math.random()*2,w:w||2+Math.random()*3,col,ph:Math.random()*6})}
function burst(x,y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=100+Math.random()*260;P.push({k:'s',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,t:0,life:.9+Math.random()*.8,w:5+Math.random()*7,col:cols[Math.random()*cols.length|0]})}}
function notes(x,y,n,col){for(let i=0;i<n;i++)P.push({k:'n',x:x+(Math.random()-.5)*90,y:y+(Math.random()-.5)*20,vx:(Math.random()-.5)*50,vy:-80-Math.random()*70,t:-i*.14,life:3.4,ch:['♪','♫','♬'][Math.random()*3|0],ph:Math.random()*6,col:col||'#f0b13b'})}
function fx(dt){
  if(!paused){for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t<0)continue;if(p.k==='s'){p.vy+=520*dt;p.vx*=.99}p.x+=p.vx*dt+((p.k==='n'||p.k==='m')?Math.sin(p.t*2+p.ph)*.8:0);p.y+=p.vy*dt;if(p.t>p.life||p.y>1150||p.y<-80)P.splice(i,1)}if(P.length>500)P.splice(0,P.length-500)}
  gx.clearRect(0,0,1990,1080);
  for(const p of P){if(p.t<0)continue;
    if(p.k==='r'){const u=p.t/p.life;gx.globalAlpha=(1-u)*.8;gx.strokeStyle=p.col;gx.lineWidth=4*(1-u)+1;gx.beginPath();gx.arc(p.x,p.y,18+u*140,0,6.3);gx.stroke()}
    else if(p.k==='n'){gx.globalAlpha=clamp((p.life-p.t)/.9)*clamp(p.t/.3);gx.fillStyle=p.col;gx.shadowColor='#000';gx.shadowBlur=8;gx.font='62px serif';gx.fillText(p.ch,p.x,p.y);gx.shadowBlur=0}
    else{const a=clamp((p.life-p.t)/p.life);gx.globalAlpha=a*(p.k==='m'?.9:1);gx.fillStyle=p.col;gx.shadowColor=p.col;gx.shadowBlur=p.k==='m'?14:6;gx.beginPath();gx.arc(p.x,p.y,p.w,0,6.3);gx.fill();gx.shadowBlur=0}}
  gx.globalAlpha=1;
}

/* ================= TEXTO ================= */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function type(el,text,k){const n=Math.floor(text.length*clamp(k));el.innerHTML=esc(text.slice(0,n))+(n<text.length?'<i></i>':'')}

/* ================= BUCLE PRINCIPAL: todo se sincroniza con el tiempo del video ================= */
let paused=false,started=false,em=0;
const FIN=()=>v.duration||32;
function fase(t){return t<9.3?'noche':t<T_BOX_FIN?'vecinas':'joe'}
function sync(){
  const t=v.currentTime;
  // cuadro de texto
  if(t<T_BOX_FIN){
    let d=D[0];for(const x of D)if(t>=x.desde)d=x;
    box.classList.add('show');who.textContent=d.quien;type(txt,d.texto,(t-d.a)/(d.b-d.a));
  }else box.classList.remove('show');
  // lugar
  lugar.classList.toggle('on',t>5.2&&t<9.8);
  // burbuja de Joe
  $('d1').classList.toggle('on',t>=19.05);
  $('d2').classList.toggle('on',t>=19.25);
  $('d3').classList.toggle('on',t>=19.45);
  const eOn=t>=19.6;ell.classList.toggle('on',eOn);
  if(eOn)type(ell,JOE.texto,(t-JOE.a)/(JOE.b-JOE.a));
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(started&&!paused){
    sync();em+=dt;const t=v.currentTime,f=fase(t);
    if(em>.25){em=0;
      if(f!=='joe'){if(Math.random()<.8)mote(Math.random()*1990,300+Math.random()*600,'#ffe9a0',false,2+Math.random()*3)}   // luciérnagas
      else if(t>23.4){notes(bubC.x-250+Math.random()*500,bubC.y+200,1)}                                         // la música "se le sale"
    }
    if(CFG.grillos&&f!=='joe'&&ac){grilloT-=dt;if(grilloT<=0){grilloT=.9+Math.random()*1.6;grillo()}}
  }
  fx(dt);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= INTERACTIVIDAD ================= */
function pos(e){const r=stage.getBoundingClientRect(),s=r.width/1990;return[(e.clientX-r.left)/s,(e.clientY-r.top)/s]}
let lastT=0;
stage.addEventListener('pointermove',e=>{if(!started||paused)return;const n=performance.now();if(n-lastT<50)return;lastT=n;const[x,y]=pos(e);mote(x,y,fase(v.currentTime)==='joe'?'#fff3c8':'#ffe9a0',false)});
stage.addEventListener('pointerdown',e=>{
  if(ac&&ac.state==='suspended'&&!paused)ac.resume();
  if(!started||paused||e.target.closest('button'))return;
  const[x,y]=pos(e),f=fase(v.currentTime);
  if(f==='noche'){ripple(x,y,'#ffe9a0');burst(x,y,['#ffe9a0','#fff6c8','#f0c46b'],12);bell(PENT[Math.random()*PENT.length|0],.12)}          // luciérnagas
  else if(f==='vecinas'){ripple(x,y,'#ffd9a0');burst(x,y,['#d6403a','#f2c230','#6fa83c','#e8742b'],14);pop(.18)}                                 // frutas del puesto
  else{                                                                                                                                              // la música de Joe
    ripple(x,y,'#fff');notes(x,y,3);bell(PENT[Math.random()*PENT.length|0],.16);
    const dx=x-bubC.x,dy=y-bubC.y;if(dx*dx/(380*K)**2+dy*dy/(292*K)**2<1){ell.classList.remove('wig');void ell.offsetWidth;ell.classList.add('wig');notes(x,y,3)}
  }
});
bPause.onclick=()=>{
  paused=!paused;stage.classList.toggle('paused',paused);
  if(paused){v._was=!v.paused&&!v.ended;if(v._was)v.pause()}else if(v._was){v._was=false;const p=v.play();p&&p.catch&&p.catch(()=>{})}
  if(ac){paused?ac.suspend():ac.resume()}
  bPause.textContent=paused?'▶ Seguir':'⏸ Pausa';
};

/* ================= ARRANQUE ================= */
function begin(){startEl.style.display='none';$('bar').style.display='flex';started=true;audioInit();if(ac&&ac.state==='suspended')ac.resume()}
goBtn.onclick=()=>{begin();v.currentTime=0;const p=v.play();p&&p.catch&&p.catch(()=>{})};
addEventListener('load',()=>{
  const p=v.play();
  if(p&&p.then)p.then(()=>begin()).catch(()=>{goBtn.style.display='block'});
  else goBtn.style.display='block';
});
</script>
</body>
</html>
